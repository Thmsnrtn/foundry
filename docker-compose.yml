# =============================================================================
# FOUNDRY — Local Development Docker Compose
# Usage: docker compose up
# =============================================================================

services:
  app:
    build:
      context: .
      target: deps
    command: npx tsx watch src/index.ts
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/internal/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
