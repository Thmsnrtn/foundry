name: Foundry UI North Star

# VERIFICATION ONLY.
#
# This workflow used to re-run the handoff applicator scripts and commit their
# output back to the branch on every push, which raced every hand-made
# reconstruction commit on the same branch. The supplied handoff has been
# applied; the reconstruction continues by hand against the boards. What this
# lane keeps is the fast proof: typecheck, the owner-surface invariants that
# hold the North Star behaviours, and a build. The production gate in
# deploy-private.yml runs the full chain before anything ships.
on:
  push:
    branches:
      - gpt/ui-handoff-v3-north-star
      - claude/foundry-v3-north-star-finish-vxq2ea
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Owner-surface invariants
        run: |
          npx vitest --run \
            tests/unit/the-owner-os-is-a-cockpit-not-a-second-institution.test.ts \
            tests/unit/a-button-wider-than-the-phone.test.ts \
            tests/unit/one-stylesheet-one-vocabulary.test.ts \
            tests/unit/twelve-journeys-on-the-phone-he-holds.test.ts \
            tests/unit/mobile-owner-navigation-follows-v3-context.test.ts \
            tests/unit/a-roadmap-nobody-can-wish-into.test.ts \
            tests/unit/the-owner-can-reach-the-one-thing.test.ts \
            tests/unit/the-north-star-composition-holds.test.ts
      - name: Build
        run: npm run build
