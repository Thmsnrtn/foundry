# =============================================================================
# Deploy Private Foundry
#
# WHY THIS EXISTS RATHER THAN `fly deploy` FROM A DEVELOPMENT SHELL.
#
# The image has to be built somewhere with Docker and unrestricted network, and
# the agent environment has neither: Fly's depot builder needs a gRPC channel
# the egress proxy cannot pass (x509: certificate signed by unknown authority),
# Fly's classic remote builder answers `unauthorized` to an app-scoped deploy
# token, and there is no local Docker daemon. A GitHub runner has all three.
#
# `--local-only` builds the image ON THE RUNNER and pushes it to Fly's registry,
# so no Fly builder is provisioned at all and an app-scoped deploy token is
# sufficient. That is the whole reason this path works where the others did not.
#
# Manual trigger only. A private institution should not redeploy because someone
# pushed a commit.
# =============================================================================
name: Deploy Private Foundry

# TRIGGERED BY A MARKED COMMIT, BECAUSE THE OTHER TWO DOORS ARE SHUT.
#
# workflow_dispatch only exists for workflows on the DEFAULT branch, and this
# work lives on the campaign branch. Tag pushes were the next design and the
# git proxy refuses them with HTTP 403 — this environment may push the
# designated branch and nothing else.
#
# So the trigger is a push to the campaign branch, and the deploy is gated on a
# marker in the commit message. Ordinary work pushes dozens of commits and none
# of them deploy; a commit whose message contains [deploy-private] is a
# deliberate, auditable request to redeploy the private institution.
#
# THE BRANCH NAME IS PER-SESSION, AND THAT IS WHY THERE IS MORE THAN ONE.
# Each session may push its own designated branch and nothing else, so a
# trigger naming only the branch that existed when this file was written stops
# deploying the moment the campaign continues in a new session. Both are listed
# rather than a `claude/**` glob: a deploy of the private institution should
# name the branches it will accept, not accept whatever gets created.
on:
  push:
    branches:
      - 'claude/foundry-autonomous-continuation-0gents'
      - 'claude/private-foundry-continuation-51vz95'

jobs:
  deploy:
    name: Build and deploy to foundry-intel
    if: contains(github.event.head_commit.message, '[deploy-private]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The build must contain what self-observation reads. `.dockerignore`
      # excluded all of docs/ until docs/db was re-admitted; without it the
      # recursion deploys blind and says so honestly forever.
      - name: Verify the image will carry what the recursion reads
        run: |
          test -f docs/db/schema.snapshot.sql || { echo "schema snapshot missing"; exit 1; }
          grep -q 'docs/db' Dockerfile || { echo "Dockerfile does not copy docs/db"; exit 1; }

      - name: Deploy
        run: |
          flyctl deploy \
            --config fly.private.toml \
            --app foundry-intel \
            --local-only \
            --ha=false \
            --now
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Report health
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' --max-time 15 \
              https://foundry-intel.fly.dev/internal/health || true)
            if [ "$code" = "200" ]; then echo "healthy:"; cat /tmp/h.json; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 15
          done
          echo "health never returned 200"; flyctl logs --app foundry-intel --no-tail | tail -40; exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # WHAT THE OWNER WOULD MEET, ASKED OF THE RELEASE ITSELF.
      #
      # The owner opened the deployed product and got a 404 from the only button
      # on the screen. The deploy had reported success, because success meant
      # /internal/health answered 200 — a probe that cannot see a page, a link
      # or a form. Every gate ran against the repository; nothing ever asked
      # the running release a question.
      #
      # Unauthenticated, so this cannot check what a signed-in owner sees. What
      # it can check is that the surface exists and answers as itself: his
      # routes must not 404, and they must challenge rather than serve.
      - name: Ask the release whether it is there
        run: |
          fail=0
          for path in /foundry /foundry/companies /foundry/controls /foundry/ask; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15               "https://foundry-intel.fly.dev$path" || echo 000)
            case "$code" in
              401|403|302|303|200) echo "ok   $path -> $code" ;;
              404) echo "GONE $path -> 404 — a route the owner uses is not in this release"; fail=1 ;;
              *)   echo "BAD  $path -> $code"; fail=1 ;;
            esac
          done
          # AND THE PART THAT WOULD ACTUALLY HAVE CAUGHT IT.
          #
          # Under /foundry the session middleware answers 401 before routing, so
          # asking unauthenticated cannot tell a missing route from a live one —
          # every check above would have passed on the release that 404'd. The
          # release now says which routes it registered, and the ones his
          # screens post to are named here.
          curl -s --max-time 15 https://foundry-intel.fly.dev/internal/routes > /tmp/routes.json
          for want in "POST /foundry/ask" "POST /foundry/venture" "POST /foundry/companies" "GET /foundry" "POST /foundry/reference"; do
            if grep -q "$want" /tmp/routes.json; then
              echo "ok   $want is in this release"
            else
              echo "GONE $want is not in this release — a screen posts to it"; fail=1
            fi
          done
          exit $fail
