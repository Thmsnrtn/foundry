name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # `npm run check` is the composite gate: typecheck, ratchets, kernel
      # boundary, guard NULL-safety, public-claims audit, consequential-effects
      # audit, and the full test suite. CI used to run typecheck, ratchet and
      # the tests individually, which meant the four audit gates ran ONLY on a
      # developer's machine — a PR could turn one red and still go green here.
      - run: npm run check
      - run: npm run build
      - run: npm audit --audit-level=high || true

  column-drift:
    name: Schema column drift (INSERT + UPDATE-SET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: npm ci
      # Verifies every INSERT column list and UPDATE-SET column against the real
      # migrated schema — the drift class that shipped ~55 runtime 500s this cycle.
      - run: npm run lint:columns
      # Every model call must name the company paying for it. Without a
      # productId only the GLOBAL spend ceiling applies, so one company's
      # runaway loop exhausts the budget for all of them.
      - run: npm run lint:ai-attribution

  evals:
    name: Prompt/AI eval net (2.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Deterministic (LLM mocked). Fails the build the moment a prompt edit
      # breaks the cache-cost or output-contract invariants — prompt
      # regressions cannot ship silently.
      - run: npm run test:evals

  walkthrough-sim:
    name: Stranger-safety walkthrough sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Boots the real route handlers + real migrations against an in-memory DB
      # and drives 15+ personas through the actual UI + mutation flows, asserting
      # 0 5xx, 0 tenant leaks, and that writes land. Exits non-zero on any finding.
      - run: npm run sim:walkthrough

  cron-load:
    name: Cron lock load/contention (3.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Stress-tests the distributed job lock the web/worker split depends on:
      # N instances race each job (exactly one wins), expired leases are
      # reclaimed, and a full 75-job sweep stays well under the cron budget.
      - run: npm run load:crons

  schema-drift:
    name: Schema snapshot up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y sqlite3
      - name: Regenerate snapshot
        run: bash scripts/schema-snapshot.sh
      - name: Verify clean diff
        run: |
          if ! git diff --exit-code docs/db/schema.snapshot.sql; then
            echo ""
            echo "❌ Schema snapshot is out of date."
            echo "   Run: bash scripts/schema-snapshot.sh"
            echo "   Then commit the updated docs/db/schema.snapshot.sql."
            exit 1
          fi
