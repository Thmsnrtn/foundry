name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test
  TURSO_DATABASE_URL: "file::memory:"
  CLERK_SECRET_KEY: sk_test_ci
  CLERK_PUBLISHABLE_KEY: pk_test_ci
  ANTHROPIC_API_KEY: sk-ant-ci
  STRIPE_SECRET_KEY: sk_test_ci
  APP_URL: http://localhost:8080
  ENCRYPTION_KEY: ci-test-encryption-key-32bytes-long

jobs:
  check:
    name: Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t foundry:test .
