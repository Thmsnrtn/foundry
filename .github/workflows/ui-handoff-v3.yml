name: Foundry UI Handoff V3

on:
  push:
    branches:
      - 'gpt/owner-os-visual-reconstruction'

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[ui-handoff-v3]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/owner-os-visual-reconstruction
          fetch-depth: 0

      - name: Apply canonical Owner OS handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              source = path.read_text()
              if new in source:
                  return
              if old not in source:
                  raise SystemExit(f"{label}: expected source fragment not found in {path}")
              path.write_text(source.replace(old, new, 1))

          # ------------------------------------------------------------------
          # SHELL / INFORMATION ARCHITECTURE
          # Keep route semantics intact; change only the owner's geography.
          # Mobile: Home / Portfolio / Experiments / Inbox / Ask.
          # Desktop: full canonical owner rail.
          # ------------------------------------------------------------------
          shell = Path('src/views/owner/shell.ts')
          s = shell.read_text()

          s = s.replace(
              "export type Place = 'foundry' | 'decisions' | 'companies' | 'experiments' | 'inbox' | 'controls'\n  | 'advanced';",
              "export type Place = 'foundry' | 'decisions' | 'companies' | 'discover' | 'experiments' | 'inbox'\n  | 'activity' | 'money' | 'controls' | 'advanced';"
          )

          s = s.replace(
              '''return html`${object}<section class="more" aria-label="Also here">\n    <a href="/foundry/searching"${where?.scope.kind === 'searching' ? raw(' class="on"') : ''}>Discover</a>\n    <a href="/foundry/public-workshop">Workshop</a>\n    <a href="/foundry/money">Money</a>\n    <a href="/foundry/roadmap">Roadmap</a>\n  </section>`;''',
              '''return html`${object}<section class="more" aria-label="Also here">\n    <a href="/foundry/decisions">Decisions</a>\n    <a href="/foundry/public-workshop">Workshop</a>\n    <a href="/foundry/roadmap">Roadmap</a>\n    <a href="/foundry/absence">Absence test</a>\n  </section>`;'''
          )

          s = s.replace(
              "  portfolio: '<svg viewBox=\"0 0 24 24\"><path d=\"M3 17c3-4 6 0 9-3s6 1 9-3\"/><path d=\"M3 12c3-4 6 0 9-3s6 1 9-3\"/></svg>',\n};",
              "  portfolio: '<svg viewBox=\"0 0 24 24\"><path d=\"M3 17c3-4 6 0 9-3s6 1 9-3\"/><path d=\"M3 12c3-4 6 0 9-3s6 1 9-3\"/></svg>',\n  discover: '<svg viewBox=\"0 0 24 24\"><circle cx=\"11\" cy=\"11\" r=\"6.5\"/><path d=\"m16 16 4 4M11 8v6M8 11h6\"/></svg>',\n  activity: '<svg viewBox=\"0 0 24 24\"><path d=\"M4 12h3l2-5 4 10 2-5h5\"/></svg>',\n  money: '<svg viewBox=\"0 0 24 24\"><path d=\"M4 18V9M10 18V5M16 18v-6M22 18H2\"/></svg>',\n  ask: '<svg viewBox=\"0 0 24 24\"><path d=\"M5 5h14v11H9l-4 3z\"/><path d=\"M9 9h6M9 12h4\"/></svg>',\n};"
          )

          s = s.replace(
              '<div class="brand"><b>F</b> Private Foundry</div>',
              '''<div class="brand"><span class="forge-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 3v26M7 11c5 0 9 5 9 5s-4 5-9 5c0-5 4-10 9-10Zm18 0c-5 0-9 5-9 5s4 5 9 5c0-5-4-10-9-10Z"/></svg></span><span class="brand-copy"><b>Foundry</b><small>Private Lab for Digital Income Streams</small></span></div>'''
          )

          old_nav = '''<nav class="places${where && where.scope.kind === 'company' && where.local.length ? ' behind' : ''}" aria-label="Places"><div>\n  ${door('/foundry', 'foundry', 'Home', ICONS.home, active, counts)}\n  ${door('/foundry/decisions', 'decisions', 'Decisions', ICONS.decisions, active, counts)}\n  ${door('/foundry/experiments', 'experiments', 'Experiments', ICONS.experiments, active, counts)}\n  ${door('/foundry/inbox', 'inbox', 'Inbox', ICONS.inbox, active, counts)}\n  ${door('/foundry/controls', 'controls', 'Controls', ICONS.controls, active, counts)}\n  ${door('/foundry/companies', 'companies', 'Portfolio', ICONS.portfolio, active, counts, true)}\n  ${railExtra(where)}\n</div></nav>'''
          new_nav = '''<nav class="places${where && where.scope.kind === 'company' && where.local.length ? ' behind' : ''}" aria-label="Places"><div>\n  <header class="rail-brand"><span class="forge-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 3v26M7 11c5 0 9 5 9 5s-4 5-9 5c0-5 4-10 9-10Zm18 0c-5 0-9 5-9 5s4 5 9 5c0-5-4-10-9-10Z"/></svg></span><span><b>Foundry</b><small>Private Lab for Digital Income Streams</small></span></header>\n  ${door('/foundry', 'foundry', 'Home', ICONS.home, active, counts)}\n  ${door('/foundry/companies', 'companies', 'Portfolio', ICONS.portfolio, active, counts)}\n  ${door('/foundry/searching', 'discover', 'Discover', ICONS.discover, where?.scope.kind === 'searching' ? 'discover' : active, counts, true)}\n  ${door('/foundry/experiments', 'experiments', 'Experiments', ICONS.experiments, active, counts)}\n  ${door('/foundry/inbox', 'inbox', 'Inbox', ICONS.inbox, active, counts)}\n  ${door('/foundry/activity', 'activity', 'Activity', ICONS.activity, active, counts, true)}\n  ${door('/foundry/money', 'money', 'Economics', ICONS.money, active, counts, true)}\n  ${door('/foundry/controls', 'controls', 'Controls', ICONS.controls, active, counts, true)}\n  <a class="ask-door" href="#q">${raw(ICONS.ask)}Ask</a>\n  ${railExtra(where)}\n</div></nav>'''
          if new_nav not in s:
              if old_nav not in s:
                  raise SystemExit('owner shell: canonical nav source fragment not found')
              s = s.replace(old_nav, new_nav, 1)
          shell.write_text(s)

          # ------------------------------------------------------------------
          # DEEP SURFACE SEMANTICS: give each page a visual grammar while
          # leaving every figure, authority row and effect path untouched.
          # ------------------------------------------------------------------
          activity = Path('src/routes/dashboard/activity-place.ts')
          a = activity.read_text()
          a = a.replace("return c.html(page('Activity', body, 'foundry', frame));",
                        "return c.html(page('Activity', body, 'activity', frame));")
          activity.write_text(a)

          money = Path('src/routes/dashboard/money-place.ts')
          m = money.read_text()
          m = m.replace("return c.html(page('Money', body, 'foundry', frame));",
                        "return c.html(page('Money', body, 'money', frame));")
          money.write_text(m)

          absence = Path('src/routes/dashboard/absence-place.ts')
          x = absence.read_text()
          x = x.replace('return html`<div class="know">\n    <h2>${String(r.days)} days',
                        'return html`<div class="know horizon horizon-${String(r.days)}">\n    <h2>${String(r.days)} days')
          x = x.replace('    ${readings.map(horizon)}\n\n    <div class="know">\n      <h2>What thinking costs</h2>',
                        '    <div class="absence-horizons">${readings.map(horizon)}</div>\n\n    <div class="know cognition-economics">\n      <h2>What thinking costs</h2>')
          absence.write_text(x)

          roadmap = Path('src/routes/dashboard/roadmap-place.ts')
          r = roadmap.read_text()
          r = r.replace('${open.length === 0 ? \'\' : html`<div class="know">\n      <h2>Under way</h2>',
                        '${open.length === 0 ? \'\' : html`<div class="know roadmap-open">\n      <h2>Under way</h2>')
          r = r.replace('${closed.length === 0 ? \'\' : html`<div class="know">\n      <h2>Finished, and what came of it</h2>',
                        '${closed.length === 0 ? \'\' : html`<div class="know roadmap-closed">\n      <h2>Finished, and what came of it</h2>')
          r = r.replace('    <div class="know">\n      <h2>Why you cannot add to this</h2>',
                        '    <div class="know roadmap-note">\n      <h2>Why you cannot add to this</h2>')
          roadmap.write_text(r)

          experiments = Path('src/routes/dashboard/experiments-place.ts')
          e = experiments.read_text()
          e = e.replace('html`<a class="item" href="/foundry/experiments/${v.id}">',
                        'html`<a class="item experiment-index-item" href="/foundry/experiments/${v.id}">', 1)
          experiments.write_text(e)

          # ------------------------------------------------------------------
          # SINGLE CANONICAL STYLESHEET. This is not a second overlay asset; it
          # completes the cutover in owner.css so every owner screen inherits it.
          # ------------------------------------------------------------------
          css = Path('src/public/owner.css')
          source = css.read_text()
          marker = 'FOUNDRY UI HANDOFF V3 — FINAL OWNER SYSTEM'
          if marker not in source:
              source += r'''

/* =============================================================================
   FOUNDRY UI HANDOFF V3 — FINAL OWNER SYSTEM
   Canonical visual language from the owner handoff. This block completes the
   existing reconstruction in the same stylesheet; it creates no parallel UI.
   ============================================================================= */

:root{
  --os-rail-w:15.4rem;
  --os-radius:11px;
  --os-radius-lg:14px;
  --os-emerald:#8fd1b8;
  --os-attention:#d9a85e;
}

/* Brand: institutional, quiet, recognisable without generic SaaS chrome. */
.brand{align-items:center}
.forge-mark{width:31px;height:31px;display:inline-grid;place-items:center;flex:0 0 auto;color:var(--accent)}
.forge-mark svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
.brand-copy{display:grid;gap:1px;min-width:0}
.brand-copy>b{font:500 1.08rem/1 var(--serif);letter-spacing:-.015em;color:var(--ink)}
.brand-copy>small{font:500 .58rem/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:normal}
.rail-brand{display:none}

/* The handoff is tighter and more architectural than the earlier rounded-card
   pass. Radius marks grouping; it is not decoration. */
.tile,.item,.card,.hero,.one,.standing,.noticed,.said-here,.facts.money,.launch{border-radius:var(--os-radius)}
.ask-in{border-radius:12px}
.ask input{border-radius:9px}.ask button{border-radius:9px}
.btn{border-radius:9px}

/* Page hierarchy: one editorial statement, then operational facts. */
h1{font-weight:400}
main.wrap>h1{max-width:62rem}
.lede:first-of-type{font-size:.96rem}
.know>h2:first-child{font-weight:400}
.section-kicker{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}

/* Home / cockpit: the first screen is state, consequence, economics, now, next. */
main[data-place="foundry"]>.glance{margin-top:2.25rem}
main[data-place="foundry"]>.glance::before{top:-1.55rem;letter-spacing:.18em}
main[data-place="foundry"] .tile{background:linear-gradient(180deg,var(--os-sheen),transparent 48%),var(--os-panel)}
main[data-place="foundry"] .nownext>div{border-radius:9px}

/* Experiments are probes with a visible spine; gold stays reserved for the
   place where owner consequence/exposure is live. */
.experiment-index-item{position:relative;overflow:hidden}
.experiment-index-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);opacity:.52}
.experiment-index-item .pill{font-size:.65rem}
.launch{border-color:var(--os-gold);background:radial-gradient(circle at 100% 0,var(--os-gold-soft),transparent 22rem),var(--os-panel)}

/* Absence is a horizon comparison, not three essays. */
.absence-horizons{display:grid;gap:10px;margin-top:1.25rem}
.absence-horizons .horizon{margin:0;padding:1rem;border:1px solid var(--os-line);border-radius:var(--os-radius);background:linear-gradient(180deg,var(--os-sheen),transparent 45%),var(--os-panel)}
.absence-horizons .horizon>h2:first-child{margin:0 0 .5rem;padding:0 0 .7rem;font-family:var(--serif);font-size:1.18rem;font-weight:400;letter-spacing:-.015em;border-bottom:1px solid var(--os-line)}
.absence-horizons .horizon>.lede{font-size:.88rem;line-height:1.45;margin:.6rem 0 .8rem}
.absence-horizons .horizon .sales{margin:0}
.absence-horizons .horizon .sales>li{padding:.75rem 0}
.absence-horizons .horizon .sales>li>b{display:inline;font-size:.84rem}
.absence-horizons .horizon .sales>li>p{font-size:.8rem;line-height:1.42;color:var(--ink-2);margin:.32rem 0 0}
.cognition-economics{max-width:62rem}

/* Roadmap is institutional load. Open work carries weight; closed work recedes. */
.roadmap-open .sales,.roadmap-closed .sales{list-style:none;padding:0;display:grid;gap:9px}
.roadmap-open .sales>li{padding:1rem;border:1px solid var(--os-line);border-radius:var(--os-radius);background:var(--os-panel)}
.roadmap-open .sales>li>b{font-family:var(--serif);font-size:1.04rem;font-weight:400}
.roadmap-open .sales>li>p:nth-of-type(1){font-size:.95rem;color:var(--ink);margin:.38rem 0}
.roadmap-closed{opacity:.82}.roadmap-closed .sales>li{padding:.75rem 0}
.roadmap-note{max-width:var(--os-reading);opacity:.76}

/* Activity: quiet causality, not telemetry theatre. */
main[data-place="activity"] .stream{max-width:68rem}
main[data-place="activity"] .ev{padding-block:.9rem}
main[data-place="activity"] .ev>p:nth-child(2){font-family:var(--serif);font-size:1.02rem;font-weight:400}

/* Economics: make the subtraction and reconciled numbers the visible object. */
main[data-place="money"] .facts.money{max-width:58rem}
main[data-place="money"] .mline{padding:.78rem .1rem}
main[data-place="money"] .mline.total{background:var(--os-mint-soft);margin-inline:-.8rem;padding-inline:.8rem;border-radius:8px;border-top:1px solid var(--os-mint-line)}
main[data-place="money"] .mline.total dt,main[data-place="money"] .mline.total dd{color:var(--ink)}

/* Authority reads as a reach map, not settings. */
.reach{border-top:1px solid var(--os-line)}
.reach li{display:grid;grid-template-columns:minmax(9rem,.8fr) minmax(0,1.6fr);gap:.35rem 1rem;align-items:start;padding:.85rem 0}
.reach li>p{grid-column:2}
.dial{padding:4px;border:1px solid var(--os-line);border-radius:11px;background:var(--os-command-fill)}
.dial .mark{border-color:transparent;background:transparent}
.dial .mark.on{background:var(--os-panel-raised);border-color:var(--os-line-strong);box-shadow:var(--os-shadow-soft)}

/* River / portfolio is an estate cross-section. */
.layer{position:relative;margin-left:.45rem;border-left:2px solid var(--os-mint-line);border-radius:0 var(--os-radius) var(--os-radius) 0}
.layer:last-of-type{border-left-color:var(--os-gold)}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1rem;color:var(--ink-3);font-size:.73rem}
.legend span{display:inline-flex;align-items:center;gap:.35rem}

/* Desktop is the reference cockpit: stable rail, broad canvas, dense facts. */
@media (min-width:900px){
  .wrap{margin-left:var(--os-rail-w);max-width:none;padding:1.7rem clamp(1.8rem,3.5vw,4rem) 4.5rem}
  nav.places{width:var(--os-rail-w);padding:1rem .8rem 1rem;background:linear-gradient(180deg,var(--os-sheen),transparent 14rem),var(--os-rail)}
  nav.places div::before{display:none!important;content:none!important}
  .rail-brand{display:flex;align-items:center;gap:.72rem;margin:.15rem .45rem 1rem;padding:.2rem .2rem 1.05rem;border-bottom:1px solid var(--os-line)}
  .rail-brand>span:last-child{display:grid;gap:2px;min-width:0}
  .rail-brand b{font:400 1.42rem/1 var(--serif);letter-spacing:-.02em;color:var(--ink)}
  .rail-brand small{font:500 .55rem/1.25 var(--sans);letter-spacing:.075em;text-transform:uppercase;color:var(--ink-3)}
  .rail-brand .forge-mark{width:30px;height:30px}
  nav.places a{min-height:37px;padding:6px 9px;border-radius:8px;font-size:.84rem;gap:9px}
  nav.places a svg{width:17px;height:17px}
  nav.places .sub a,nav.places .more a{min-height:31px;padding:5px 9px 5px 22px;font-size:.78rem}
  nav.places .more a{padding-left:9px}
  nav.places div::after{margin:.9rem .55rem 0;padding-top:.85rem;font-size:.53rem}
  h1{font-size:clamp(2.35rem,3.25vw,3.35rem);line-height:1.02;margin-bottom:.55rem}
  .glance{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .tile{min-height:8.1rem;padding:.9rem 1rem}
  .tile dd.v{font-size:1.6rem}
  .numbers{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .ask{width:min(52rem,100%)}
  .absence-horizons{grid-template-columns:repeat(3,minmax(0,1fr));max-width:76rem}
  .roadmap-open .sales{grid-template-columns:repeat(2,minmax(0,1fr));max-width:72rem}
  main[data-place="experiments"]>.experiment-index-item{max-width:66rem}
}

@media (min-width:1280px){
  :root{--os-rail-w:16rem}
  .wrap{padding-left:4rem;padding-right:4rem}
  .glance{grid-template-columns:repeat(6,minmax(0,1fr))}
  .tile{min-height:8.65rem}
}

/* Mobile follows the handoff's five-door rhythm and keeps the institution calm. */
@media (max-width:899px){
  .wrap{padding-top:12px;padding-left:14px;padding-right:14px}
  .brand{margin-bottom:.9rem;text-transform:none;letter-spacing:0}
  .brand-copy>b{font-size:1.05rem}.brand-copy>small{font-size:.52rem;max-width:16rem}
  h1{font-size:1.82rem;line-height:1.06}
  .glance{gap:8px}.tile{min-height:7rem;padding:.8rem}
  .tile dd.v{font-size:1.38rem}
  .nownext{gap:7px}
  nav.places a{font-size:.64rem}
  nav.places a svg{width:20px;height:20px}
  .reach li{grid-template-columns:1fr}.reach li>p{grid-column:1}
}

@media (prefers-reduced-motion:reduce){
  .tile,.item,.card,summary,.ask-in{transition:none!important}
}
'''
              css.write_text(source)

          # Fail if the migration somehow created a second owner stylesheet.
          owner_styles = list(Path('src/public').glob('owner*.css'))
          if [p.name for p in owner_styles] != ['owner.css']:
              raise SystemExit(f'expected exactly one owner stylesheet, found {owner_styles}')
          PY

      - name: Verify type and owner-surface invariants
        run: |
          npm ci
          npm run typecheck
          npx vitest --run \
            tests/unit/the-owner-os-is-a-cockpit-not-a-second-institution.test.ts \
            tests/unit/a-button-wider-than-the-phone.test.ts \
            tests/unit/one-stylesheet-one-vocabulary.test.ts \
            tests/unit/twelve-journeys-on-the-phone-he-holds.test.ts
          npm run build

      - name: Commit implemented handoff
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'OpenAI UI Reconstruction'
          git config user.email 'noreply@openai.com'
          git add \
            src/views/owner/shell.ts \
            src/public/owner.css \
            src/routes/dashboard/activity-place.ts \
            src/routes/dashboard/money-place.ts \
            src/routes/dashboard/absence-place.ts \
            src/routes/dashboard/roadmap-place.ts \
            src/routes/dashboard/experiments-place.ts
          git commit -m 'Implement Foundry UI handoff v3 [ui-handoff-v3]'
          git push origin HEAD:gpt/owner-os-visual-reconstruction
