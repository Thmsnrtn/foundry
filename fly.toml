app = "foundry-intel"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

# ─── Process groups (Phase 3.1) ─────────────────────────────────────────────
# Split the HTTP server from the scheduler so the 73 in-process cron jobs no
# longer share one machine with request handling. PROCESS_ROLE gates the
# scheduler (see src/lib/process-role.ts). DB-backed job locks keep double-runs
# impossible even across a rolling deploy.
[processes]
  web = "sh -c 'PROCESS_ROLE=web node dist/index.js'"
  worker = "sh -c 'PROCESS_ROLE=worker node dist/index.js'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2   # web: 2 machines for zero-downtime deploy overlap
  processes = ["web"]        # only web sits behind the public load balancer

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/internal/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
