app = "foundry-intel"
primary_region = "iad"
kill_signal = "SIGINT"
kill_timeout = 5

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "30s"
    method = "GET"
    path = "/internal/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1

# Cron jobs run in the main process via the CronJob scheduler.
# All 30 jobs are managed by src/jobs/index.ts and start automatically.
# No separate process group needed — they run in-process on the primary machine.
